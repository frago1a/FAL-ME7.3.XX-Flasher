name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FAL-ME73-Flasher.sln

      - name: Build
        run: dotnet build FAL-ME73-Flasher.sln -c Release --no-restore

      - name: Test
        run: dotnet test FAL-ME73-Flasher.sln -c Release --no-build
